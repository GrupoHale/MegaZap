name = "megazap"
main = "./worker.js"
compatibility_date = "2026-11-25"
keep_vars = true

[[kv_namespaces]]
binding = "MEGAZAP_STORE"

[[durable_objects.bindings]]
name = "MEGAZAP_STATE"
class_name = "InboxState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxState"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
